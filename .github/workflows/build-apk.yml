# main 에 올리면 자동으로 APK를 만들어요.
# 결과: Releases(최신) 에 ApproPin.apk / ApproPin.zip, 그리고 apk 브랜치에도 같은 파일
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ApproPin.apk
          cd dist && zip -q ApproPin.zip ApproPin.apk && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ApproPin-apk
          path: dist/ApproPin.apk
      - name: Publish to apk branch
        run: |
          cd dist
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ApproPin.apk ApproPin.zip
          git commit -q -m "APK build #${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/ApproPin.apk dist/ApproPin.zip \
            --repo "${{ github.repository }}" --target "${GITHUB_SHA}" \
            --title "ApproPin 빌드 #${{ github.run_number }}" --notes "자동 빌드된 APK예요. 휴대폰에서 ApproPin.apk 를 받아 설치하세요." --latest
