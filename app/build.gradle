plugins {
    id 'com.android.application'
}

// 서명 정보는 키 파일을 저장소에 두지 않고 읽어요.
//   · GitHub Actions: 저장소 Secrets(KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD)
//   · 내 컴퓨터:      keystore.properties (이 파일과 키 파일은 .gitignore 로 커밋에서 빠져요)
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

def signingStoreFile = System.getenv('KEYSTORE_FILE') ?: keystoreProps['storeFile']
def signingStorePassword = System.getenv('KEYSTORE_PASSWORD') ?: keystoreProps['storePassword']
def signingKeyAlias = System.getenv('KEY_ALIAS') ?: keystoreProps['keyAlias']
def signingKeyPassword = System.getenv('KEY_PASSWORD') ?: keystoreProps['keyPassword']

android {
    namespace 'com.jungcle.appropin'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jungcle.appropin'
        minSdk 29          // 안드로이드 10 이상
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            if (signingStoreFile) {
                storeFile project.file(signingStoreFile)   // keystore.properties 기준: app/release.jks
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 결과 APK 이름: ApproPin-1.2.apk
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = "ApproPin-${variant.versionName}.apk" }
}
